function el(tag, attrs) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== '') e.setAttribute(k, attrs[k]);
  return e;
}
function rrPath(x, y, w, h, r) {
  return `M${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x + r},${y + h} Q${x},${y + h} ${x},${y + h - r} L${x},${y + r} Q${x},${y} ${x + r},${y} Z`;
}
function shape(d, o) {
  if (rc) {
    svg.appendChild(rc.path(d, {
      stroke: o.stroke, strokeWidth: o.sw || 2, roughness: o.rough ?? 1.1, bowing: 1, seed: seed++,
      fill: o.fill, fillStyle: 'solid', strokeLineDash: o.dash,
    }));
  } else {
    svg.appendChild(el('path', { d, stroke: o.stroke, 'stroke-width': o.sw || 2, fill: o.fill || 'none', 'stroke-dasharray': o.dash ? o.dash.join(' ') : '' }));
  }
}
function rect(x, y, w, h, col, o = {}) {
  const [s, f] = C[col];
  shape(rrPath(x, y, w, h, o.r ?? 14), { stroke: o.stroke || s, fill: o.nofill ? undefined : (o.fill || f), dash: o.dash, sw: o.sw, rough: o.rough });
}
function text(x, y, html, cls, w, h) {
  const d = document.createElement('div');
  d.className = 't ' + (cls || '');
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  if (w) d.style.width = w + 'px';
  if (h) d.style.height = h + 'px';
  d.innerHTML = html;
  stage.appendChild(d);
  return d;
}
function box(x, y, w, h, col, h1, sub, o = {}) {
  rect(x, y, w, h, col, o);

  if (o.badge !== undefined) text(x + w - 48, y + 7, '×' + o.badge, 'badge');
}
function head(a, b, color) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  for (const s of [-1, 1]) {
    const t = ang + Math.PI - s * 0.42;
    const p = [b[0] + 15 * Math.cos(t), b[1] + 15 * Math.sin(t)];
    if (rc) svg.appendChild(rc.line(b[0], b[1], p[0], p[1], { stroke: color, strokeWidth: 2.2, roughness: 0.5, seed: seed++ }));
    else svg.appendChild(el('line', { x1: b[0], y1: b[1], x2: p[0], y2: p[1], stroke: color, 'stroke-width': 2 }));
  }
}
function line(pts, color = '#1e1e1e', o = {}) {
  if (rc) svg.appendChild(rc.linearPath(pts, { stroke: color, strokeWidth: o.sw || 2.2, roughness: 0.7, seed: seed++, strokeLineDash: o.dash }));
  else svg.appendChild(el('polyline', { points: pts.map(p => p.join(',')).join(' '), stroke: color, 'stroke-width': 2, fill: 'none', 'stroke-dasharray': o.dash ? o.dash.join(' ') : '' }));
  if (o.head !== false) head(pts[pts.length - 2], pts[pts.length - 1], color);
}
function curve(pts, color, o = {}) {
  if (rc) svg.appendChild(rc.curve(pts, { stroke: color, strokeWidth: o.sw || 2.4, roughness: 0.8, seed: seed++ }));
  else svg.appendChild(el('polyline', { points: pts.map(p => p.join(',')).join(' '), stroke: color, 'stroke-width': 2, fill: 'none' }));
  head(pts[pts.length - 2], pts[pts.length - 1], color);
}

function fit() {

  wrap.style.height = Math.ceil(1850 * s) + 'px';

async function embedFontCSS() {
  const css = await (await fetch('https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap')).text();
  let out = css;
  for (const [, u] of css.matchAll(/url\((https:[^)]+)\)/g)) {
    const blob = await (await fetch(u)).blob();
    const data = await new Promise((resolve) => { const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.readAsDataURL(blob); });
    out = out.split(u).join(data);
  }
  return out;
}

document.getElementById('png').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Rendering…';
  try {
    await document.fonts.ready;
    const fontEmbedCSS = await embedFontCSS();
    const url = await htmlToImage.toPng(stage, {
      fontEmbedCSS,
      width: 2000, height: 1850, pixelRatio: 2, backgroundColor: '#ffffff',
      style: { transform: 'none', left: '0', top: '0' },
    });
    const a = document.createElement('a');
    a.download = 'dev-skills-now.png';
    a.href = url;
    a.click();
  } catch (err) {
    alert('PNG export failed: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Download PNG';
  }
});
