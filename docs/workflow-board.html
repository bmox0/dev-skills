<title id="title">Runweld workflow, from task to merge</title>
<desc id="description">Read down the center. The Runweld CLI accompanies the whole task, from creating its worktree through recording approvals, phase reports, checks, verdicts, acceptance and finish. You and the planner agree on the intended outcome, what is in scope and what to leave out. The planner writes the full plan for the agents. You approve the run config, then a plan summary of up to 350 words. When you ask to build, implementers run ready phases in parallel. The CLI validates their reports, then full checks, review, verification and a judge inform your acceptance. The judge can order a fix round or request missing evidence. Both paths return to the judge before landing.</desc>
