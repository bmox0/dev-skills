interface:
  display_name: "Grill"
  short_description: "Use when a task is still fuzzy and needs talking through before anything is planned — \"let's grill this\", \"think this through with me\", \"I'm not sure what we're actually building\", \"help me work out what I want\". Interviews the idea into a shared understanding, and ends in alignment and a stop — no document, no code."
